# Configuration pour le déploiement sur Render
services:
  - type: web
    name: gazoduc-invest
    env: node
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
    plan: free
    region: oregon
    autoDeploy: true
